<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghphone</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #0f766e; --bad: #b91c1c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --accent: #2dd4bf; --bad: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 36rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub, footer { color: var(--muted); }
  textarea, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: .5rem .6rem; }
  textarea { width: 100%; margin-top: 2rem; min-height: 8rem; font-family: ui-monospace, monospace; }
  button { cursor: pointer; margin-top: .5rem; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; font-family: ui-monospace, monospace; font-size: .9rem; }
  td, th { text-align: left; padding: .35rem .5rem .35rem 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-family: system-ui, sans-serif; }
  .bad { color: var(--bad); }
  footer { margin-top: 3rem; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Ghana phone number checker</h1>
  <p class="sub">Paste numbers in any format, one per line. Get the standard format and the network.</p>
  <form id="f">
    <textarea id="nums" aria-label="Phone numbers, one per line">0244123456
+233 50 123 4567
(027) 123 4567
0304123456</textarea>
    <button>Check</button>
  </form>
  <div id="out" aria-live="polite"></div>
  <footer>
    <p>The network is read from the prefix, so numbers ported to another network show their original one.</p>
    <p><a href="https://github.com/nadeem0305/ghphone">Source</a> · Go library and CLI</p>
  </footer>
</main>
<script>
const out = document.getElementById("out");
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
async function run(e) {
  e?.preventDefault();
  try {
    const res = await fetch("/api/parse?numbers=" + encodeURIComponent(document.getElementById("nums").value));
    if (!res.ok) throw new Error(await res.text());
    const rows = await res.json() || [];
    out.innerHTML = rows.length ? `<table><tr><th>Input</th><th>Standard</th><th>Network</th></tr>${rows.map(r =>
      r.valid ? `<tr><td>${esc(r.input)}</td><td>${r.e164}</td><td>${r.network}</td></tr>`
              : `<tr><td>${esc(r.input)}</td><td class="bad" colspan="2">invalid</td></tr>`).join("")}</table>` : "";
  } catch (err) {
    out.textContent = "Check failed: " + err.message;
  }
}
document.getElementById("f").onsubmit = run;
run();
</script>
</body>
</html>
